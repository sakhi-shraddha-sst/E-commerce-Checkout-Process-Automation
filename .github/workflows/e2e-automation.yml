name: E-Commerce Automated End-to-End Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      runmode:
        description: 'Execution Environment'
        required: true
        default: 'local'
        type: choice
        options:
          - 'local'
          - 'grid'
          - 'browserstack'
          - 'saucelabs'
      browser:
        description: 'Browser'
        required: true
        default: 'chrome'
        type: choice
        options:
          - 'chrome'
          - 'firefox'
          - 'edge'
          - 'safari'
      suiteFile:
        description: 'TestNG Suite File'
        required: true
        default: 'src/test/resources/testng.xml'
        type: choice
        options:
          - 'src/test/resources/testng.xml'
          - 'src/test/resources/testng-cloud.xml'
          - 'src/test/resources/testng-crossbrowser.xml'
      testFilter:
        description: 'Optional single test class (e.g. CheckoutTest). Leave empty for full suite.'
        required: false
        default: ''
        type: string

jobs:
  test:
    name: Run ${{ github.event.inputs.browser || 'chrome' }} on ${{ github.event.inputs.runmode || 'local' }}
    runs-on: ${{ (github.event.inputs.browser == 'safari' || github.event.inputs.runmode == 'local' && github.event.inputs.browser == 'safari') && 'macos-latest' || 'ubuntu-latest' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start Docker Selenium Grid
        if: ${{ (github.event.inputs.runmode || 'local') == 'grid' }}
        run: |
          echo "Starting Docker Compose Grid..."
          docker compose up -d --wait
          curl -s http://localhost:4444/status

      - name: Run Maven Automated Tests
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESSKEY: ${{ secrets.BROWSERSTACK_ACCESSKEY }}
          SAUCELABS_USERNAME: ${{ secrets.SAUCELABS_USERNAME }}
          SAUCELABS_ACCESSKEY: ${{ secrets.SAUCELABS_ACCESSKEY }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          APP_MASTER_KEY: ${{ secrets.APP_MASTER_KEY }}
        run: |
          RUN_MODE="${{ github.event.inputs.runmode || 'local' }}"
          BROWSER="${{ github.event.inputs.browser || 'chrome' }}"
          SUITE="${{ github.event.inputs.suiteFile || 'src/test/resources/testng.xml' }}"
          TEST_FILTER="${{ github.event.inputs.testFilter || '' }}"

          CMD="mvn clean test -Drunmode=${RUN_MODE} -Dbrowser=${BROWSER} -DsuiteFile=${SUITE} -Dheadless=true"

          if [ -n "$TEST_FILTER" ]; then
            CMD="$CMD -Dtest=${TEST_FILTER}"
          fi

          echo "Executing: $CMD"
          eval $CMD

      - name: Teardown Docker Selenium Grid
        if: ${{ always() && (github.event.inputs.runmode || 'local') == 'grid' }}
        run: |
          docker compose down

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 14
